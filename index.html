<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chats — MessagingApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="phone-frame">

    <!-- Top bar -->
    <header class="top-bar">
      <h1 class="top-bar__title">Chats</h1>
      <div class="top-bar__actions">
        <button class="icon-btn" id="search-btn" aria-label="Search chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="camera-btn" aria-label="Open camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button class="icon-btn" id="menu-btn" aria-label="More options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <!-- Stories / status -->
    <div class="stories" id="story-list">
      <!-- populated by index.js -->
    </div>

    <!-- Filter chips -->
    <nav class="filters" id="filter-list">
      <button class="filter-chip is-active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="favorites">Favorites</button>
      <button class="filter-chip" data-filter="work">Work</button>
      <button class="filter-chip" data-filter="groups">Groups</button>
      <button class="filter-chip" data-filter="communities">Communities</button>
    </nav>

    <!-- Chat list -->
    <ul class="chat-list" id="chat-list">
      <!-- populated by index.js -->
    </ul>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
      <a class="nav-item is-active" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5H4l2.3-3.5A8.38 8.38 0 1 1 21 11.5z"/></svg>
        Chats
      </a>
      <a class="nav-item" href="#" id="calls-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Calls
      </a>
      <button class="nav-fab" id="new-chat-btn" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <a class="nav-item" href="#" id="updates-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Updates
      </a>
      <a class="nav-item" href="#" id="profile-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
  </main>

  <script src="js/index.js"></script>
</body>
</html>
